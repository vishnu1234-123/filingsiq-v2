<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilingsIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14181F;
    --bg-raised: #1B2028;
    --text: #E8E6DF;
    --text-dim: #9AA0AC;
    --border: #2A3038;
    --accent: #4A7C8C;
    --accent-bright: #6FA3B4;
    --ticker: #C9A66B;
    --negative: #B85C5C;
    --positive: #6C9A72;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  .app {
    display: flex; flex-direction: column; height: 100vh; max-width: 760px;
    margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  header {
    padding: 20px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 {
    font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.01em;
  }
  header .status {
    font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace;
  }
  header .status .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--positive); margin-right: 6px;
  }
  .log {
    flex: 1; overflow-y: auto; padding: 8px 24px;
  }
  .turn { padding: 20px 0; border-bottom: 1px solid var(--border); }
  .turn:last-child { border-bottom: none; }
  .q { font-size: 15px; line-height: 1.5; margin-bottom: 12px; color: var(--text); }
  .q .label { color: var(--text-dim); font-size: 12px; margin-right: 8px; }
  .a-row { display: flex; align-items: flex-start; gap: 10px; }
  .ticker {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500;
    color: var(--ticker); background: rgba(201, 166, 107, 0.1);
    border: 1px solid rgba(201, 166, 107, 0.3); border-radius: 3px;
    padding: 2px 6px; flex-shrink: 0; margin-top: 2px;
  }
  .a-text {
    font-size: 15px; line-height: 1.6; flex: 1;
    font-variant-numeric: tabular-nums;
  }
  .a-text .blocked { color: var(--negative); font-style: italic; }
  .a-text .cached { color: var(--text-dim); font-size: 11px; margin-left: 8px; font-family: 'IBM Plex Mono', monospace; }
  .feedback { margin-top: 10px; display: flex; gap: 4px; }
  .feedback button {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--text-dim); cursor: pointer; padding: 4px 8px; font-size: 13px;
    transition: border-color 0.15s, color 0.15s;
  }
  .feedback button:hover { border-color: var(--accent); color: var(--accent-bright); }
  .feedback button.active-up { border-color: var(--positive); color: var(--positive); }
  .feedback button.active-down { border-color: var(--negative); color: var(--negative); }
  .feedback button:disabled { cursor: default; opacity: 0.6; }
  .feedback .note { font-size: 11px; color: var(--text-dim); align-self: center; margin-left: 4px; }
  .composer-wrap { border-top: 1px solid var(--border); }
  .roster {
    padding: 10px 24px 0; font-size: 11px; color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em;
  }
  .roster .ticker-inline {
    color: var(--ticker); margin-right: 2px;
  }
  .composer {
    padding: 10px 24px 16px; display: flex; gap: 10px;
  }
  .composer input {
    flex: 1; background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 11px 14px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  .composer input:focus { border-color: var(--accent); }
  .composer button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 6px;
    padding: 0 20px; font-size: 14px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: background 0.15s;
  }
  .composer button:hover:not(:disabled) { background: var(--accent-bright); }
  .composer button:disabled { opacity: 0.5; cursor: default; }
  .empty-state {
    color: var(--text-dim); font-size: 14px; padding: 40px 0; text-align: center;
  }
  .pending { color: var(--text-dim); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>FilingsIQ</h1>
    <div class="status"><span class="dot"></span>connected</div>
  </header>
  <div class="log" id="log">
    <div class="empty-state" id="empty-state">Ask about revenue, margin, risk factors, or anything else across the companies on file.</div>
  </div>
  <div class="composer-wrap">
    <div class="roster" id="roster"></div>
    <div class="composer">
      <input type="text" id="question-input" placeholder="What was Apple's revenue in FY2025?" autocomplete="off">
      <button id="send-btn">Ask</button>
    </div>
  </div>
</div>

<script>
  let sessionId = null;
  let knownCompanies = [];
  const log = document.getElementById('log');
  const input = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const rosterEl = document.getElementById('roster');
  let emptyStateCleared = false;

  // Fetched from the backend rather than hardcoded here, so this can
  // never silently drift out of sync with the real supported-company
  // list in router.py's FILENAME_MAP.
  (async function loadRoster() {
    try {
      const res = await fetch('/companies');
      const data = await res.json();
      knownCompanies = data.companies || [];
      rosterEl.textContent = 'On file: ';
      knownCompanies.forEach((c, i) => {
        const span = document.createElement('span');
        span.className = 'ticker-inline';
        span.textContent = c.toUpperCase() + (i < knownCompanies.length - 1 ? ',' : '');
        rosterEl.appendChild(document.createTextNode(i === 0 ? '' : ' '));
        rosterEl.appendChild(span);
      });
    } catch (err) {
      rosterEl.textContent = '';
    }
  })();

  function clearEmptyState() {
    if (!emptyStateCleared) { log.innerHTML = ''; emptyStateCleared = true; }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  async function ask() {
    const question = input.value.trim();
    if (!question) return;
    clearEmptyState();
    input.value = '';
    sendBtn.disabled = true;

    const turn = document.createElement('div');
    turn.className = 'turn';
    turn.innerHTML = `
      <div class="q"><span class="label">You</span>${escapeHtml(question)}</div>
      <div class="a-row pending">Thinking...</div>
    `;
    log.appendChild(turn);
    log.scrollTop = log.scrollHeight;

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, session_id: sessionId }),
      });
      if (!res.ok) {
        // Surface the REAL server error instead of letting a failed
        // .json() parse on a plain-text error body mask it with a
        // confusing "not valid JSON" message that hides what actually
        // went wrong server-side.
        const bodyText = await res.text();
        throw new Error(`Server returned ${res.status}: ${bodyText.slice(0, 300)}`);
      }
      const data = await res.json();
      sessionId = data.session_id;

      const aRow = turn.querySelector('.a-row');
      aRow.classList.remove('pending');

      if (data.blocked) {
        const rosterHint = knownCompanies.length
          ? ` This covers ${knownCompanies.map(c => c.toUpperCase()).join(', ')} only.`
          : '';
        const reason = data.block_reason === 'out_of_domain' || data.block_reason === 'ambiguous_or_missing_company'
          ? `Couldn't match that to a company on file.${rosterHint}`
          : `Couldn't answer that: ${escapeHtml(data.block_reason || 'unknown reason')}`;
        aRow.innerHTML = `<div class="a-text"><span class="blocked">${reason}</span></div>`;
      } else {
        const cachedNote = data.served_from_cache ? '<span class="cached">(cached)</span>' : '';
        aRow.innerHTML = `
          <span class="ticker">${escapeHtml((data.company || '?').toUpperCase())}</span>
          <div class="a-text">${escapeHtml(data.answer || 'No answer returned.')}${cachedNote}
            <div class="feedback" data-company="${escapeHtml(data.company || '')}" data-question="${escapeHtml(data.standalone_question || '')}">
              <button class="up" title="Good answer">&#128077;</button>
              <button class="down" title="Wrong answer -- removes it from cache">&#128078;</button>
              <span class="note"></span>
            </div>
          </div>
        `;
        wireFeedback(aRow.querySelector('.feedback'));
      }
    } catch (err) {
      const aRow = turn.querySelector('.a-row');
      aRow.classList.remove('pending');
      aRow.innerHTML = `<div class="a-text"><span class="blocked">Request failed: ${escapeHtml(err.message)}</span></div>`;
    } finally {
      sendBtn.disabled = false;
      log.scrollTop = log.scrollHeight;
    }
  }

  function wireFeedback(container) {
    const company = container.dataset.company;
    const standaloneQuestion = container.dataset.question;
    const upBtn = container.querySelector('.up');
    const downBtn = container.querySelector('.down');
    const note = container.querySelector('.note');

    async function send(thumbsUp, clickedBtn, otherBtn) {
      upBtn.disabled = true; downBtn.disabled = true;
      clickedBtn.classList.add(thumbsUp ? 'active-up' : 'active-down');
      try {
        await fetch('/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ company, standalone_question: standaloneQuestion, thumbs_up: thumbsUp }),
        });
        note.textContent = thumbsUp ? 'Thanks.' : 'Flagged -- removed from cache.';
      } catch (err) {
        note.textContent = 'Feedback failed to send.';
        upBtn.disabled = false; downBtn.disabled = false;
        clickedBtn.classList.remove(thumbsUp ? 'active-up' : 'active-down');
      }
    }
    upBtn.addEventListener('click', () => send(true, upBtn, downBtn));
    downBtn.addEventListener('click', () => send(false, downBtn, upBtn));
  }

  sendBtn.addEventListener('click', ask);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
